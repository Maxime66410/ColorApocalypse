plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge"
}

// Mojang ships Java 25 to end users in 26.2, so the mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The actual code lives in ../src, shared with the Forge/Fabric builds - only the loader-specific
// bootstrap packages and manifests are excluded from each other's build.
sourceSets {
    main {
        java {
            srcDirs = ['../src/main/java']
            exclude 'org/furranystudio/colorapocalypse/forge/**'
            exclude 'org/furranystudio/colorapocalypse/fabric/**'
        }
        resources {
            srcDirs = ['../src/main/resources']
            exclude 'fabric.mod.json'
            exclude 'META-INF/mods.toml'
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('../run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = layout.projectDirectory.dir('../run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
