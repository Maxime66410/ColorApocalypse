org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
# IntelliJ isn't yet fully compatible with configuration cache (FabricMC/fabric-loom#1349).
org.gradle.configuration-cache=false

# Must match the Forge build's Minecraft version. Values per https://fabricmc.net/develop/
# and the official FabricMC/fabric-example-mod repo's 26.2 branch.
minecraft_version=26.2
loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.4
fabric_api_version=0.158.0+26.2

# Shared metadata - keep in sync with the root gradle.properties (each loader is its own
# standalone Gradle project, so these can't be included from the root automatically).
mod_id=colorapocalypse
mod_name=ColorApocalypse
mod_license=MIT
mod_version=1.0.0
mod_group_id=org.furranystudio
mod_authors=Maxime66410
mod_description=ColorApocalypse is a multiplayer Minecraft mod that turns your survival experience into a chaotic and unpredictable challenge. The concept is simple: the world gradually loses its colors, and each color that disappears causes the instant destruction of all associated blocks in your world.
